name: Continuous Delivery

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  EC2_APP_PATH: ${{ vars.EC2_APP_PATH || '/home/ubuntu/Challenge_MLE' }}
  EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'airline-delay' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'challenge-mle:latest' }}

jobs:
  deploy:
    name: Test and Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "Missing secret: EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing secret: EC2_USER"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "Missing secret: EC2_SSH_KEY"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-test.txt
          pip install -r requirements.txt

      - name: Run tests before deploy
        run: |
          make model-test
          make api-test

      - name: Local Docker build validation
        run: docker build -t challenge-mle:cd-check .

      - name: Deploy on EC2 through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ env.EC2_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_PATH="${{ env.EC2_APP_PATH }}"
            BRANCH="${{ github.ref_name }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_PATH/.git" ]; then
              if [ -e "$APP_PATH" ]; then
                echo "Path '$APP_PATH' exists but is not a git repository."
                exit 1
              fi
              git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$APP_PATH"
            fi

            cd "$APP_PATH"
            git fetch --all --prune
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            docker build -t "${{ env.IMAGE_NAME }}" .
            docker rm -f "${{ env.CONTAINER_NAME }}" >/dev/null 2>&1 || true
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p 8000:8000 \
              "${{ env.IMAGE_NAME }}"

            if command -v curl >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8000/health >/dev/null
            fi

      - name: Deployment summary
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "Target: AWS EC2"
            echo "Host: \`${{ secrets.EC2_HOST }}\`"
            echo "Container: \`${{ env.CONTAINER_NAME }}\`"
            echo "Image tag: \`${{ env.IMAGE_NAME }}\`"
            echo "Branch: \`${{ github.ref_name }}\`"
            echo "Health endpoint: \`http://${{ secrets.EC2_HOST }}:8000/health\`"
          } >> "$GITHUB_STEP_SUMMARY"
